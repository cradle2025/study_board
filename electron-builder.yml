appId: io.github.studyboard.app
productName: StudyBoard
copyright: Copyright © 2026 study-board contributors

directories:
  output: release/${version}
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.{map,md,ts}'
  - '!**/{.eslintrc,.editorconfig,.gitignore,.github}'

# 运行时不需要任何原生模块（.node）：生产依赖全是纯 JS / WASM，
# 所以两个平台共用一套产物，不需要 electron-rebuild，也不会有 ABI 不匹配
asar: true
asarUnpack:
  - resources/**

# 供主进程读取版本号等信息
extraMetadata:
  main: out/main/index.js

# 只带用得上的语言包。
#
# Electron 默认把 Chromium 的 55 个语言包全带上，解包后 49 MB —— 是安装包
# 里仅次于 Electron 自身二进制的大头。本项目是中英双语应用，其余 51 个
# 语言永远用不到。
#
# 留四个是有意的：
#   zh-CN / zh-TW  简体、繁体
#   en-US / en-GB  英式、美式（en-US 还是 Chromium 的内置兜底，
#                  删掉它会让所有非匹配语言的系统退化成硬编码字符串）
#
# 系统语言不在列表里时会自动回退到 en-US，不会崩，只是界面文案变英文。
# 注意：这影响的是 Chromium 自己的 UI 文案（右键菜单、拼写检查等），
# 应用自身的中文界面是渲染层自己画的，跟这些 .pak 无关。
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - en-GB

win:
  target:
    - target: nsis
      arch:
        - x64
  # 由 build/icon.png 自动派生 .ico
  icon: build/icon.png
  artifactName: StudyBoard-${version}-win-${arch}-setup.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StudyBoard
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  # 更新 / 卸载时保住便携模式的数据目录。默认行为会把整个 $INSTDIR
  # 递归删掉，而 study-board-data 就在里面 —— 见该文件的注释
  include: build/installer.nsh

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.png
  category: public.app-category.education
  artifactName: StudyBoard-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 study-board contributors

dmg:
  title: StudyBoard ${version}
  artifactName: StudyBoard-${version}-mac-${arch}.${ext}
  contents:
    - x: 140
      y: 220
    - x: 400
      y: 220
      type: link
      path: /Applications
